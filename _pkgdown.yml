url: https://junjunlab.github.io/ggutils/

template:
  bootstrap: 5

logo: man/figures/logo.png

reference:
  - title: 智能轴标签 (Smart axis guides)
    desc: >
      分类轴上的标签过多时，只显示用户指定的那一部分标签，
      用引导线把每个标签连回它对应的刻度，并把标签在轴外侧
      分行（x 轴）或分列（y 轴）错开排布。
    contents:
      - guide_axis_smart
      - GuideAxisSmart

  - title: 坐标系统 (Coordinates)
    desc: >
      把普通 ggplot 弯成阿基米德螺线：x 沿螺线作为角度、y 作为轨道内的半径，
      自带角度轴和径向刻度轴，支持 facet_wrap() / facet_grid()。
    contents:
      - coord_spiral
      - CoordSpiral
      - scale_x_spiral_axis
      - scale_y_spiral_axis

  - title: 聚类树 (Cluster trees)
    desc: >
      给 x / y 分类轴加一棵层次聚类树：配套 scale 用聚类叶序重排分类顺序，
      树与数据严格对齐；分面时按面板逐棵重算，树自动贴到 strip 内侧。
    contents:
      - guide_axis_cluster
      - cluster_order
      - strip_cluster

  - title: 分面 (Facets)
    desc: >
      逐面板自由的 facet_grid：scales = "free_x" / "free_y" / "free" 按面板放开，
      而不是像 facet_grid() 那样按列 / 按行自由。
    contents:
      - facet_gridn

  - title: 排布算法 (Layout algorithms)
    desc: >
      guide 内部使用的三个底层排布算法：一维防重叠"压紧"
      （circlize::smartAlign 的移植）、盒式排布
      （ComplexHeatmap::BoxArrange 的移植）以及把它们串起来的
      多行堆叠。它们也可以在包外单独调用。
    contents:
      - smart_align
      - box_arrange
      - smart_stack

  - title: 内置数据 (Datasets)
    desc: >
      示例和 vignette 使用的真实数据：GEO GSE52778 的 RNA-seq 热图
      （300 个高变基因 × 8 个样本的行 z-score 矩阵），以及 Seurat PBMC3k
      教程的 marker 表与 dot plot 数据。
    contents:
      - airway_heatmap
      - pbmc3k_markers
      - pbmc3k_dotplot
